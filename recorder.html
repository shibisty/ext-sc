<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ScreenRec Toolkit</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 380px; min-height: 260px; margin: 0; }
    .wrap { padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%; background: #e04343;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .row { display: flex; align-items: center; gap: 10px; }
    .time { font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .status { font-size: 13px; opacity: .75; }
    video.preview {
      width: 100%; max-height: 140px; border-radius: 10px; background: #000;
      object-fit: contain; display: none;
    }
    .btns { display: flex; gap: 10px; width: 100%; }
    button {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #e04343; color: #fff; }
    .btn-secondary { background: var(--btn-secondary-bg); color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="dot" id="dot"></div><div class="time" id="time">00:00</div></div>
    <div class="status" id="status" data-i18n="recorderPreparing">Preparing capture…</div>
    <video class="preview" id="preview" muted playsinline></video>
    <div class="btns">
      <button class="btn-secondary" id="cancelBtn" data-i18n="recorderCancelBtn">Cancel</button>
      <button class="btn-primary" id="stopBtn" data-i18n="recorderStopBtn" disabled>Stop &amp; Save</button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
