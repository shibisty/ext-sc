<!doctype html>
<html data-surface="log">
<head>
  <meta charset="utf-8" />
  <title>ScreenRec Toolkit — Log</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { margin: 0; padding: 32px 24px 48px; display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 640px; }
    .top-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .top-row img { width: 28px; height: 28px; }
    h1 { font-size: 19px; margin: 0; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin: 6px 0 24px; line-height: 1.5; }

    .entry {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
      margin-bottom: 10px;
    }
    .entry-icon {
      width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; background: var(--btn-secondary-bg); flex-shrink: 0;
    }
    .entry-main { flex: 1; min-width: 0; }
    .entry-filename {
      font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .entry-actions button {
      border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
      border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .entry-actions button:hover { filter: brightness(1.05); }

    .empty-state {
      text-align: center; padding: 48px 16px; color: var(--text-muted); font-size: 13.5px;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted);
      text-decoration: none; margin-bottom: 18px; cursor: pointer; background: none; border: none;
      padding: 0; font-family: inherit;
    }
    .back-link:hover { color: var(--text); }
    /* The "←" glyph itself doesn't flip with `dir`, so mirror it for RTL
       (Arabic/Persian/Hebrew) rather than pointing "back" the wrong way;
       the text ("Back"/etc., via data-i18n) already reflows correctly on
       its own since `dir` drives the browser's own bidi layout. */
    .back-arrow { display: inline-block; }
    [dir="rtl"] .back-arrow { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="back-link" id="btnBack"><span class="back-arrow" aria-hidden="true">←</span> <span data-i18n="logBack">Back</span></button>
    <div class="top-row">
      <img src="icons/icon32.png" alt="" />
      <h1 data-i18n="logPageTitle">Save log</h1>
    </div>
    <p class="subtitle" data-i18n="logPageSubtitle">Your last 10 screenshots and recordings.</p>

    <div id="list"></div>
    <div class="empty-state" id="emptyState" hidden data-i18n="logEmpty">Nothing saved yet.</div>
  </div>

  <script type="module" src="shim.js"></script>
  <script type="module" src="log.js"></script>
</body>
</html>
